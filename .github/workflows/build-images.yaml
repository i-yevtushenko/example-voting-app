name: Build images

on:
  push:
    branches:
      - main
    paths:
      - vote/**
      - result/**
      - worker/**
      - charts/voting-app/**
      - .github/workflows/build-images.yaml

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: ${{ matrix.image }}
    runs-on: voting-app-runners
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - vote
          - result
          - worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tags
        run: |
          echo "IMAGE=${REGISTRY}/$(echo '${{ github.repository }}/${{ matrix.image }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # Runners are amd64; arm64 images are built via QEMU.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.SHORT_SHA }}
            ${{ env.IMAGE }}:latest

  publish-values:
    name: Write root values.yaml tags
    needs: build-and-push
    if: success()
    runs-on: voting-app-runners
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Update image tags
        run: |
          short_sha="${GITHUB_SHA::7}"
          image_prefix="${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          python3 - "$short_sha" "$image_prefix" <<'PY'
          import re
          import sys
          from pathlib import Path

          sha, prefix = sys.argv[1], sys.argv[2]
          path = Path("values.yaml")
          text = path.read_text()
          for name in ("vote", "result", "worker"):
              text = re.sub(
                  rf"({name}:\n  image:\n    repository: )\S+(\n    tag: )[\"']?\S+[\"']?",
                  rf'\g<1>{prefix}/{name}\g<2>"{sha}"',
                  text,
                  count=1,
              )
          path.write_text(text)
          PY

      - name: Upload values
        uses: actions/upload-artifact@v4
        with:
          name: values
          path: values.yaml

      - name: Commit values
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add values.yaml
          if git diff --staged --quiet; then
            echo "No values change"
            exit 0
          fi
          git commit -m "Update image tags to ${GITHUB_SHA::7}"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"

  publish-chart:
    name: Push Helm OCI chart
    needs: build-and-push
    if: success()
    runs-on: voting-app-runners
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set chart coordinates
        run: |
          echo "CHART_REPO=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/charts" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "CHART_VERSION=$(awk '/^version:/ {print $2; exit}' charts/voting-app/Chart.yaml)" >> "$GITHUB_ENV"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "${{ env.REGISTRY }}" -u "${{ github.actor }}" --password-stdin

      - name: Package and push
        run: |
          mkdir -p dist
          helm package charts/voting-app --destination dist --version "${CHART_VERSION}" --app-version "${SHORT_SHA}"
          helm package charts/voting-app --destination dist --version "${CHART_VERSION}-${SHORT_SHA}" --app-version "${SHORT_SHA}"
          helm push "dist/voting-app-${CHART_VERSION}.tgz" "oci://${CHART_REPO}"
          helm push "dist/voting-app-${CHART_VERSION}-${SHORT_SHA}.tgz" "oci://${CHART_REPO}"
          echo "Pushed oci://${CHART_REPO}/voting-app:${CHART_VERSION}"
          echo "Pushed oci://${CHART_REPO}/voting-app:${CHART_VERSION}-${SHORT_SHA}"

      - name: Upload Helm packages
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: dist/*.tgz
