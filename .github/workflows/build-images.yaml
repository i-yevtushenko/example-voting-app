name: Build images

on:
  push:
    branches:
      - main
    paths:
      - vote/**
      - result/**
      - worker/**
      - .github/workflows/build-images.yaml

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: ${{ matrix.image }}
    runs-on: voting-app-runners
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - vote
          - result
          - worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tags
        run: |
          echo "IMAGE=${REGISTRY}/$(echo '${{ github.repository }}/${{ matrix.image }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # Runners are amd64; arm64 images are built via QEMU.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.SHORT_SHA }}
            ${{ env.IMAGE }}:latest

  publish-values:
    name: Write values-images.yaml
    needs: build-and-push
    if: success()
    runs-on: voting-app-runners
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Write image values
        run: |
          image_prefix="${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          short_sha="${GITHUB_SHA::7}"
          {
            echo "# Generated by CI. Do not edit by hand."
            echo "vote:"
            echo "  image:"
            echo "    repository: ${image_prefix}/vote"
            echo "    tag: ${short_sha}"
            echo "result:"
            echo "  image:"
            echo "    repository: ${image_prefix}/result"
            echo "    tag: ${short_sha}"
            echo "worker:"
            echo "  image:"
            echo "    repository: ${image_prefix}/worker"
            echo "    tag: ${short_sha}"
          } > charts/voting-app/values-images.yaml

      - name: Upload values overlay
        uses: actions/upload-artifact@v4
        with:
          name: values-images
          path: charts/voting-app/values-images.yaml

      - name: Commit values overlay
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/voting-app/values-images.yaml
          if git diff --staged --quiet; then
            echo "No values change"
            exit 0
          fi
          git commit -m "Update image tags to ${GITHUB_SHA::7}"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"


