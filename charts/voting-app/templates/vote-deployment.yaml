apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "voting-app.fullname" . }}-vote
  labels:
    {{- include "voting-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: vote
  annotations:
    {{- include "voting-app.syncWave" "2" | nindent 4 }}
spec:
  replicas: {{ .Values.vote.replicaCount }}
  selector:
    matchLabels:
      {{- include "voting-app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: vote
  template:
    metadata:
      labels:
        {{- include "voting-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: vote
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: vote
          image: {{ include "voting-app.image" (dict "root" . "component" .Values.vote) }}
          imagePullPolicy: {{ .Values.vote.image.pullPolicy }}
          ports:
            - name: vote
              containerPort: 80
          env:
            {{- include "voting-app.redisAppEnv" . | nindent 12 }}
