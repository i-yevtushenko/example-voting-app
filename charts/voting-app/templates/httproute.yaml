{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "voting-app.fullname" . }}-vote
  labels:
    {{- include "voting-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: vote
  annotations:
    {{- include "voting-app.syncWave" "3" | nindent 4 }}
spec:
  hostnames:
    - {{ .Values.domains.vote | quote }}
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: {{ include "voting-app.fullname" . }}-vote
          port: {{ .Values.vote.service.port }}
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "voting-app.fullname" . }}-result
  labels:
    {{- include "voting-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: result
  annotations:
    {{- include "voting-app.syncWave" "3" | nindent 4 }}
spec:
  hostnames:
    - {{ .Values.domains.result | quote }}
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  rules:
    - backendRefs:
        - group: traefik.io
          kind: TraefikService
          name: {{ include "voting-app.fullname" . }}-result-sticky
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
{{- end }}
